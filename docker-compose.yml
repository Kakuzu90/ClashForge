# ClashForge (Clash Commons) local dev stack. Laravel app lives in ./src.
# No Redis by design: cache, queue and sessions use the database driver (specs/06 §4).
# Media: MinIO locally (profile `storage`), Cloudflare R2 in staging/production; swapping is .env only.
# Ported from CoCCommunity infra (P0-01).
name: clashforge

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: clashforge-app:local
  volumes:
    - ./src:/var/www/html
  networks:
    - clashforge
  environment:
    INERTIA_SSR_URL: http://ssr:13714
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    # php-fpm (default CMD), served by nginx in `web`.

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - clashforge

  # Vite dev server + npm tooling (typecheck, lint, vitest, build).
  node:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    networks:
      - clashforge

  # Queue workers per specs/20 §1. --rest keeps idle database-queue workers from hammering
  # Postgres; --max-time recycles hourly. Job-level timeouts override --timeout where set.
  queue:
    <<: *app
    command: php artisan queue:work database --queue=high,default --tries=3 --sleep=1 --rest=0.2 --max-time=3600
    restart: unless-stopped
    stop_grace_period: 130s

  # Image (later video) processing: exactly one process, CPU-capped, on the `media` connection
  # whose retry_after (1200 s) outlives the 900 s job timeout (specs/10 §6, specs/20 §5).
  # Boot first clears temp dirs a killed worker left behind (specs/10 §10).
  queue-media:
    <<: *app
    command: sh -c "php artisan media:sweep-temp; exec php artisan queue:work media --queue=media --tries=2 --sleep=3 --max-time=3600 --memory=512 --timeout=900"
    restart: unless-stopped
    stop_grace_period: 910s
    cpus: 1.0

  queue-sync:
    <<: *app
    command: php artisan queue:work database --queue=sync,low --tries=3 --sleep=2 --rest=0.2 --max-time=3600
    restart: unless-stopped
    stop_grace_period: 310s

  scheduler:
    <<: *app
    command: sh -c "while :; do php artisan schedule:run --no-interaction; sleep 60; done"
    restart: unless-stopped

  # Inertia SSR renderer for public routes (specs/06 §2). Profile `ssr`; needs `npm run build` first.
  ssr:
    <<: *app
    command: php artisan inertia:start-ssr
    restart: unless-stopped
    environment:
      INERTIA_SSR_URL: http://127.0.0.1:13714
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:13714/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    profiles:
      - ssr

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-clashforge}
      POSTGRES_USER: ${DB_USERNAME:-clashforge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-clashforge} -d ${DB_DATABASE:-clashforge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - clashforge

  # Catches outgoing mail. UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - clashforge

  # S3-compatible storage standing in for Cloudflare R2. Profile `storage`. Console :9001.
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - clashforge
    profiles:
      - storage

  # One-shot: creates the bucket, opens public/ and game/ (mirroring the R2 + CDN binding) and
  # expires quarantine/ objects after 31 days, the same lifecycle rule R2 needs (specs/10 §2).
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_BUCKET: ${AWS_BUCKET:-clashcommons-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$AWS_BUCKET &&
      mc anonymous set download local/$$AWS_BUCKET/public &&
      mc anonymous set download local/$$AWS_BUCKET/game &&
      (mc ilm rule rm --all --force local/$$AWS_BUCKET >/dev/null 2>&1 || true) &&
      mc ilm rule add --prefix quarantine/ --expire-days 31 local/$$AWS_BUCKET &&
      echo 'minio ready: bucket '$$AWS_BUCKET' with public/ and game/ readable'
      "
    networks:
      - clashforge
    profiles:
      - storage

  # Postgres GUI. Profile `tools`. UI at http://localhost:8081
  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    networks:
      - clashforge
    profiles:
      - tools

networks:
  clashforge:
    driver: bridge

volumes:
  pgdata:
  miniodata:
