# Layering from specs/19 §2. A violation fails scripts/check.sh with file and line.
# Exceptions need an entry in deptrac.allowlist with a comment (specs/19 §2).
# Per-module rules (no cross-module Models, edge/leaf isolation) are Pest arch tests in
# tests/Architecture/ModuleBoundariesTest.php, which discover modules automatically.
deptrac:
  paths:
    - ./app
  layers:
    - name: Http
      collectors:
        - type: classLike
          value: ^App\\Http\\.*
    - name: DomainPublic
      collectors:
        - type: classLike
          value: ^App\\Domain\\[^\\]+\\(Services|Actions|Queries|Data|Enums|Contracts)\\.*
    - name: DomainEvents
      collectors:
        - type: classLike
          value: ^App\\Domain\\[^\\]+\\Events\\.*
    - name: DomainModels
      collectors:
        - type: classLike
          value: ^App\\Domain\\[^\\]+\\Models\\.*
    - name: DomainInternal
      collectors:
        - type: classLike
          value: ^App\\Domain\\[^\\]+\\(Exceptions|Jobs|Listeners|Notifications|Policies|Support)\\.*
    - name: Support
      collectors:
        - type: classLike
          value: ^App\\Support\\.*
  ruleset:
    Http:
      - DomainPublic
      - Support
    DomainPublic:
      - DomainPublic
      - DomainEvents
      - DomainModels
      - DomainInternal
      - Support
    DomainEvents:
      - DomainPublic
      - DomainModels
      - Support
    DomainModels:
      - DomainPublic
      - DomainModels
      - DomainInternal
      - Support
    DomainInternal:
      - DomainPublic
      - DomainEvents
      - DomainModels
      - DomainInternal
      - Support
    Support: ~
