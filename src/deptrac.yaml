# Module boundaries from specs/19 §2. A violation fails scripts/check.sh with file and line.
# Exceptions need an entry in deptrac.allowlist with a comment (specs/19 §2).
# Per-module isolation (Domain X must not use Domain Y Models; edge/leaf modules) is added in P0-02,
# one layer per module, once app/Domain exists.
deptrac:
  paths:
    - ./app
  exclude_files:
    - '#.*test.*#i'
  layers:
    - name: Http
      collectors:
        - type: classLike
          value: ^App\\Http\\.*
    - name: DomainServices
      collectors:
        - type: classLike
          value: ^App\\Domain\\[^\\]+\\(Services|Actions|Queries|Data|Enums|Contracts|Events|Exceptions|Support)\\.*
    - name: DomainModels
      collectors:
        - type: classLike
          value: ^App\\Domain\\[^\\]+\\Models\\.*
    - name: DomainInternal
      collectors:
        - type: classLike
          value: ^App\\Domain\\[^\\]+\\(Jobs|Listeners|Notifications|Policies)\\.*
    - name: Support
      collectors:
        - type: classLike
          value: ^App\\Support\\.*
  ruleset:
    Http:
      - DomainServices
      - Support
    DomainServices:
      - DomainServices
      - DomainModels
      - Support
    DomainModels:
      - DomainModels
      - DomainServices
      - Support
    DomainInternal:
      - DomainServices
      - DomainModels
      - DomainInternal
      - Support
    Support: ~
