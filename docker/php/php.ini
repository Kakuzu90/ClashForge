memory_limit = 512M
max_execution_time = 120

; Direct-to-R2 uploads use signed URLs, so PHP rarely receives large files.
; These cover avatars/screenshots posted through the app.
upload_max_filesize = 25M
post_max_size = 30M

opcache.enable = 1
opcache.enable_cli = 0
opcache.jit = 1255
opcache.jit_buffer_size = 64M
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
realpath_cache_size = 8M
realpath_cache_ttl = 600
